name: Validate extension references

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/ci-compiler-pin.mjs --all
      - run: npm run test:build-runner
      - run: npm run verify

  guest-builds:
    needs: inventory
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, go, rust, typescript]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pins
        env:
          LANGUAGE: ${{ matrix.language }}
        run: node scripts/ci-compiler-pin.mjs "$LANGUAGE" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v4
        if: matrix.language == 'csharp'
        with:
          dotnet-version: ${{ steps.pins.outputs.compiler }}
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version: ${{ steps.pins.outputs.compiler }}
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.language == 'rust'
        with:
          toolchain: ${{ steps.pins.outputs.compiler }}
          targets: wasm32-wasip2
      - uses: actions/setup-node@v4
        if: matrix.language == 'typescript'
        with:
          node-version: ${{ steps.pins.outputs.compiler }}
      - name: Build and check all ${{ matrix.language }} references
        run: node scripts/build-references.mjs --language=${{ matrix.language }}
