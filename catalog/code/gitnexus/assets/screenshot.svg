<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title>GitNexus MCP preview</title>
  <desc>Preview of a code graph query flowing through GitNexus MCP.</desc>
  <rect width="1280" height="720" fill="#0f172a"/>
  <rect x="72" y="72" width="1136" height="576" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="112" y="132" fill="#f8fafc" font-family="Segoe UI, Arial" font-size="42" font-weight="700">GitNexus MCP</text>
  <text x="112" y="178" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="24">Indexed code graph tools for impact, symbols, calls, and blast radius</text>
  <rect x="112" y="232" width="430" height="78" rx="12" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
  <text x="142" y="281" fill="#e0f2fe" font-family="Consolas, monospace" font-size="24">mcp__gitnexus__*</text>
  <circle cx="738" cy="356" r="46" fill="#38bdf8"/>
  <circle cx="914" cy="252" r="42" fill="#a3e635"/>
  <circle cx="996" cy="462" r="42" fill="#f97316"/>
  <circle cx="778" cy="530" r="38" fill="#22c55e"/>
  <path d="M779 335l100-59M775 381l181 68M746 402l28 92M904 292l74 132" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <text x="112" y="390" fill="#f8fafc" font-family="Segoe UI, Arial" font-size="30" font-weight="600">Ask graph-shaped questions</text>
  <text x="112" y="435" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="23">Where is this symbol used?</text>
  <text x="112" y="474" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="23">What breaks if this API changes?</text>
  <text x="112" y="513" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="23">Which files sit on the call path?</text>
</svg>
