[package]
name = "glixo-extension-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Typed guest-side helpers for Glixo WebAssembly extensions"
repository = "https://github.com/tmedanovic/glixo-community-modules"
documentation = "https://docs.glixo.dev"
readme = "README.md"
include = ["Cargo.toml", "README.md", "LICENSE", "src/**/*.rs"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
