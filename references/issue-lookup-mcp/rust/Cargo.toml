[package]
name = "glixo_contribution_guest"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
glixo-extension-sdk = { path = "../../../packages/extension-sdk/rust" }
wit-bindgen = { version = "=0.62.0", default-features = false, features = ["macros"] }
serde = { version = "=1.0.228", features = ["derive"] }
